[package]
name = "ai-media-provenance-checker"
version = "0.1.0"
edition = "2024"
description = "Test whether C2PA Content Credentials survive image processing pipelines"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ranajahanzaib/ai-media-provenance-checker"
rust-version = "1.96"
keywords = ["c2pa", "provenance", "content-credentials", "image-processing"]
categories = ["command-line-utilities", "multimedia::images"]
exclude = ["PLAN.md"]

[dependencies]
anyhow = "1"
c2pa = { version = "=0.91.11", features = ["file_io"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
