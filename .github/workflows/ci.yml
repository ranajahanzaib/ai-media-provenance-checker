name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build
        run: cargo build --locked --release
      - name: Run signed end-to-end demo
        run: ./scripts/demo.sh "$RUNNER_TEMP/ai-media-provenance-checker-demo"
      - name: Preserve demo reports
        uses: actions/upload-artifact@v4
        with:
          name: ai-media-provenance-checker-demo-${{ matrix.os }}
          path: ${{ runner.temp }}/ai-media-provenance-checker-demo/report.*
          if-no-files-found: error
